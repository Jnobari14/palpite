<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel Admin | Palpite Premiado</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <span class="eyebrow">Painel privado</span>
        <h1>Admin Pulse</h1>
      </div>
      <a class="support-link" href="index.html">Ver index</a>
    </header>

    <section class="card" id="loginAdmin">
      <h2>Acesso admin</h2>
      <label>
        Senha
        <input type="password" id="adminSenha" placeholder="Digite a senha" />
      </label>
      <button class="primary-btn" id="entrarAdminBtn">Entrar</button>
      <small>Senha inicial no código: <strong>xxxxxxx</strong>. Somene Admin
        .</small>
    </section>

    <section class="hidden" id="painelAdmin">
      <section class="card">
        <h2>Configurações gerais</h2>

        <label>
          WhatsApp de suporte / recebimento
          <input type="tel" id="whatsappAdmin" placeholder="5599999999999" />
        </label>

        <label>
          Regras do bolão
          <textarea id="regrasAdmin" rows="8"></textarea>
        </label>

        <button class="primary-btn" id="salvarConfigBtn">Salvar configurações</button>
      </section>

      <section class="card">
        <h2>Criar novo jogo</h2>

        <div class="grid-2">
          <label>
            Time A
            <input type="text" id="timeA" placeholder="Brasil" />
          </label>

          <label>
            Bandeira Time A
            <input type="text" id="bandeiraA" placeholder="🇧🇷 ou URL da imagem" />
          </label>

          <label>
            Time B
            <input type="text" id="timeB" placeholder="Argentina" />
          </label>

          <label>
            Bandeira Time B
            <input type="text" id="bandeiraB" placeholder="🇦🇷 ou URL da imagem" />
          </label>

          <label>
            Data
            <input type="date" id="dataJogo" />
          </label>

          <label>
            Horário
            <input type="time" id="horaJogo" />
          </label>

          <label>
            Valor do palpite
            <input type="number" id="valorPalpite" min="0" step="0.01" placeholder="10" />
          </label>
        </div>

        <button class="primary-btn" id="adicionarJogoBtn">Adicionar jogo</button>
      </section>

      <section class="card">
        <h2>Jogos cadastrados</h2>
        <div id="adminJogosContainer"></div>
      </section>

      <section class="card">
        <h2>Palpites recebidos</h2>
        <div id="adminPalpitesContainer"></div>
      </section>

      <section class="card">
        <h2>Resumo financeiro</h2>
        <p>Total validado: <strong id="totalValidado">R$ 0,00</strong></p>
        <p>Prêmio no index: <strong id="premioAdmin">R$ 0,00</strong></p>
        <p>Casa 10%: <strong id="casaAdmin">R$ 0,00</strong></p>
      </section>
    </section>
  </main>

  <script src="shared.js"></script>
  <script src="admin.js"></script>
</body>

</html>
